services:
  # Redis
  redis:
    image: eqalpha/keydb
    ports:
      - "6379:6379"

  # MongoDB
  database:
    image: mongo
    command: mongod --replSet rs0
    ports:
      - "27017:27017"
    volumes:
      - ./.data/db:/data/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # MinIO
  minio:
    image: firstfinger/minio:latest
    #command: server /data
    environment:
      MINIO_ROOT_USER: minioautumn
      MINIO_ROOT_PASSWORD: minioautumn
      MINIO_REGION: minio
    volumes:
      - ./.data/minio:/data
    ports:
      - "14009:9000"
      - "14010:9001"
    restart: always

  # Create buckets for minio.
  createbuckets:
    # MinIO's own client image is no longer publicly pullable: docker.io/minio/mc
    # was removed (2026-09-12) and quay.io/minio/mc now returns 401 (2026-09-24),
    # which failed every CI run at docker:start. The bucket only needs an S3
    # "make bucket", so use AWS's public CLI image against MinIO instead.
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioautumn
      AWS_SECRET_ACCESS_KEY: minioautumn
      AWS_DEFAULT_REGION: minio
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
        echo 'Waiting minio...' && sleep 1;
      done; aws --endpoint-url http://minio:9000 s3 mb s3://revolt-uploads || true; exit 0;"

  # Rabbit
  rabbit:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./.data/rabbit:/var/lib/rabbitmq
      #- ./rabbit_plugins:/opt/rabbitmq/plugins/
      #- ./rabbit_enabled_plugins:/etc/rabbitmq/enabled_plugins
      # uncomment this if you need to enable other plugins
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, for development

  # Mock SMTP server
  maildev:
    image: maildev/maildev
    ports:
      - "14025:25"
      - "14080:8080"
    environment:
      MAILDEV_SMTP_PORT: 25
      MAILDEV_WEB_PORT: 8080
      MAILDEV_INCOMING_USER: smtp
      MAILDEV_INCOMING_PASS: smtp

  livekit:
    image: ghcr.io/stoatchat/livekit-server:v1.9.14
    command: --config /etc/livekit.yml
    network_mode: "host"
    volumes:
      - ./livekit.yml:/etc/livekit.yml
